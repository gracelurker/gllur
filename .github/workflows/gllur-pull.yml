name: GLLUR Instagram pull

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Pull Instagram metrics
        env:
          META_APP_ID:     ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python ig_metrics_puller.py

      - name: Commit refreshed data
        run: |
          git config user.name  "gllur-bot"
          git config user.email "gllur-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data refresh $(date -u +%FT%TZ)"
          git push
